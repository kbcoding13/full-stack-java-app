services:
  postgres:
    image: postgres:17-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      # Override POSTGRES_PORT if you already run PostgreSQL on 5432 locally — otherwise the
      # host port silently resolves to that instance and the app fails to authenticate.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    # Last release before LocalStack began requiring LOCALSTACK_AUTH_TOKEN; a 2026.x image
    # exits with code 55 on license activation unless a token is supplied.
    image: localstack/localstack:4.14.0
    container_name: inventory-localstack
    environment:
      DEBUG: 0
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  localstack-data:
