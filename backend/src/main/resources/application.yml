spring:
  application:
    name: inventory

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Never change this to create/update.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  jwt:
    # Dev-only default. Override with a 256-bit random secret in every real environment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTI1Ng==}
    issuer: inventory-api
    access-token-ttl: PT15M
    refresh-token-ttl: P7D

  storage:
    bucket: ${S3_BUCKET:inventory-local}
    region: ${AWS_REGION:us-east-1}
    # Set for LocalStack / MinIO. Leave blank to use real AWS endpoints.
    endpoint: ${S3_ENDPOINT:http://localhost:4566}
    path-style-access: ${S3_PATH_STYLE:true}
    presign-ttl: PT15M
    max-image-bytes: 5242880
    allowed-image-types: image/jpeg,image/png,image/webp
    max-attachment-bytes: 10485760
    allowed-attachment-types: application/pdf,image/jpeg,image/png,text/csv,text/plain

logging:
  level:
    org.springframework.jdbc.core: ${SQL_LOG_LEVEL:INFO}
